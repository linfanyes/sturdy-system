<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>园丁工作台 · Web 端</title>
  <script>
    // 主题色 CSS 变量（米黄奶油色系，与小程序/app 对齐）
    (function () {
      const root = document.documentElement
      const light = {
        '--cream-50': '253 251 244', '--cream-100': '250 246 235', '--cream-200': '245 238 220', '--cream-300': '238 226 195',
        '--butter-100': '255 248 224', '--butter-300': '255 224 138', '--butter-400': '255 206 84', '--butter-500': '245 179 66', '--butter-600': '214 148 38',
        '--mint-100': '224 247 230', '--mint-300': '127 209 163', '--mint-400': '74 174 122', '--mint-500': '46 139 87',
        '--sakura-100': '252 233 238', '--sakura-300': '244 165 184', '--sakura-400': '231 105 140', '--sakura-500': '201 67 109',
        '--sky2-100': '224 240 252', '--sky2-300': '125 195 240', '--sky2-400': '56 152 224', '--sky2-500': '28 111 179',
        '--cocoa-100': '245 238 230', '--cocoa-300': '214 188 160', '--cocoa-500': '157 116 80', '--cocoa-700': '107 76 52', '--cocoa-900': '61 42 28',
      }
      const dark = {
        '--cream-50': '42 38 32', '--cream-100': '52 47 40', '--cream-200': '68 61 52', '--cream-300': '90 80 68',
        '--butter-100': '58 52 40', '--butter-300': '120 90 40', '--butter-400': '180 130 50', '--butter-500': '210 160 70', '--butter-600': '230 190 100',
        '--mint-100': '32 48 38', '--mint-300': '60 110 80', '--mint-400': '90 160 120', '--mint-500': '120 190 140',
        '--sakura-100': '52 38 44', '--sakura-300': '130 70 95', '--sakura-400': '180 100 130', '--sakura-500': '210 130 160',
        '--sky2-100': '32 44 56', '--sky2-300': '60 110 150', '--sky2-400': '90 160 200', '--sky2-500': '120 190 220',
        '--cocoa-100': '52 44 36', '--cocoa-300': '120 100 80', '--cocoa-500': '170 140 110', '--cocoa-700': '210 185 155', '--cocoa-900': '240 220 195',
      }
      const mode = localStorage.getItem('g_theme_mode') || 'light'
      const vars = mode === 'dark' ? dark : light
      for (const k in vars) root.style.setProperty(k, vars[k])
      if (mode === 'dark') root.classList.add('dark')
    })()
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
