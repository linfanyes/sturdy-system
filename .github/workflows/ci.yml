name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ 后端：类型检查 + 构建 ============
  server:
    name: Server (typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -p tsconfig.build.json --noEmit

  # ============ Web 管理端：类型检查 + 构建 ============
  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Build shared package (dist needed by file: dependency)
        working-directory: shared
        run: |
          npm ci
          npm run build

      - name: Install web dependencies
        working-directory: web-app
        run: npm ci

      - name: Type check (vue-tsc)
        working-directory: web-app
        run: npx vue-tsc --noEmit

      - name: Build (vite)
        working-directory: web-app
        run: npx vite build

  # ============ 小程序：构建 mp-weixin ============
  mini:
    name: Mini-program (build mp-weixin)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mini-program/package-lock.json

      - name: Build shared package
        working-directory: shared
        run: |
          npm ci
          npm run build

      - name: Install mini-program dependencies
        working-directory: mini-program
        run: npm ci

      - name: Build mp-weixin
        working-directory: mini-program
        run: npx uni build -p mp-weixin

      - name: Verify main package size < 2MB
        working-directory: mini-program
        run: |
          du -sk dist/build/mp-weixin | awk '{print "main pkg bytes: " $1*1024}'
          SIZE=$(du -sk dist/build/mp-weixin | awk '{print $1}')
          if [ "$SIZE" -gt 2048 ]; then echo "❌ 主包超过 2MB 限制"; exit 1; fi
          echo "✅ 主包 ${SIZE}KB < 2048KB 限制"
