name: Web 前端 CI

on:
  push:
    branches: [master]
    paths:
      - 'web-app/**'
      - 'mini-program/**'
      - 'shared/**'
      - 'server/**'
      - 'e2e/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'web-app/**'
      - 'mini-program/**'
      - 'shared/**'
      - 'server/**'
      - 'e2e/**'
      - '.github/workflows/ci.yml'

# 默认权限：仅读取内容（test / e2e 不需要写权限）
permissions:
  contents: read

jobs:
  test:
    name: 单元测试 + 覆盖率
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      - name: 安装依赖（锁定版本）
        run: npm ci

      - name: 运行测试并生成覆盖率
        run: npm run test:coverage

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: web-app/coverage
          retention-days: 14

  e2e-smoke:
    name: 端到端冒烟 (Web + 小程序等价)
    runs-on: ubuntu-latest
    # 与单元测试并行跑，互不阻塞，反馈更快
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ---- 构建 Web 前端（vite preview 直连云后端，无需代理）----
      - name: 安装 Web 前端依赖
        working-directory: web-app
        run: npm ci

      - name: 构建 Web 前端
        working-directory: web-app
        run: npm run build

      # ---- 构建小程序 H5 等价包（uni build -p h5）----
      - name: 安装小程序依赖
        working-directory: mini-program
        run: npm ci

      - name: 构建小程序 H5 等价包
        working-directory: mini-program
        run: npm run build:h5

      # ---- 安装冒烟测试依赖（puppeteer 自带 Chromium）----
      - name: 安装 e2e 依赖
        working-directory: e2e
        run: npm ci

      # ---- 启动 preview + 跑 Web 冒烟 + 小程序等价冒烟 ----
      # 同一步内完成：保证后台 preview 进程生命周期覆盖整个测试；
      # 两条冒烟都跑完再统一判红（任一条出现新的非基线失败即退出 1）。
      - name: 运行端到端冒烟
        working-directory: web-app
        env:
          # 云托管后端地址（公网可达）；账号走脚本默认值 admin/admin、teacher1/123456，
          # 校管账号缺失时由超管接口临时创建并在结束时自动删除。
          SMOKE_API_BASE: 'https://tec-work-283329-8-1440166408.sh.run.tcloudbase.com/api'
        run: |
          set -u
          npm run preview -- --port 4173 --strictPort > /tmp/vite-preview.log 2>&1 &
          PREVIEW_PID=$!

          # 等待 preview 就绪
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173 >/dev/null; then echo "[ci] vite preview ready"; break; fi
            sleep 2
          done

          cd ../e2e
          npm run smoke:web; WEB=$?
          SMOKE_MINI_SKIP_BUILD=1 npm run smoke:mini; MINI=$?
          cd ../web-app
          kill $PREVIEW_PID 2>/dev/null || true

          echo "[ci] web=$WEB mini=$MINI"
          if [ "$WEB" -ne 0 ] || [ "$MINI" -ne 0 ]; then
            echo "[ci] 冒烟存在失败，退出码 1"
            exit 1
          fi

      - name: 上传冒烟报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-reports
          path: e2e/reports
          retention-days: 14
